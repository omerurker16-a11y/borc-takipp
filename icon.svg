<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fcd34d;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#d97706;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#78350f;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dx="0" dy="8" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.5"/>
      </feComponentTransfer>
      <feMerge> 
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/> 
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect x="0" y="0" width="512" height="512" rx="120" fill="url(#bgGrad)" />
  
  <!-- Outer Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#goldGrad)" stroke-width="8" opacity="0.3" />
  
  <!-- Main Symbol: Abstract Chart/Shield -->
  <g transform="translate(256, 256) scale(1.1)" filter="url(#shadow)">
    <!-- Pie Chart Segments -->
    <path d="M0 -120 A120 120 0 1 1 -103.9 60 L0 0 Z" fill="url(#goldGrad)" />
    <!-- Floating Segment (Debt Paid) -->
    <path d="M-130 90 L-26 15 A120 120 0 0 0 -15 -145 Z" fill="#334155" opacity="0.5" transform="translate(-10, -10)" />
    
    <!-- Inner Checkmark/Arrow -->
    <path d="M-40 10 L0 50 L80 -30" fill="none" stroke="#0f172a" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>