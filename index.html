<script>
        // Screen Switching Logic
        window.switchScreen = (screen) => {
            const loansScreen = document.getElementById('loansScreen');
            const addScreen = document.getElementById('addScreen');
            const recsScreen = document.getElementById('recommendationsScreen');
            const budgetScreen = document.getElementById('budgetScreen');
            
            const navLoans = document.getElementById('navLoans');
            const navRecs = document.getElementById('navRecs');
            const navBudget = document.getElementById('navBudget');

            // Hide all
            loansScreen.classList.add('hidden');
            addScreen.classList.add('hidden');
            recsScreen.classList.add('hidden');
            budgetScreen.classList.add('hidden');
            
            // Inactive Style
            const inactiveClass = "flex flex-col items-center justify-center w-full h-full text-slate-400 dark:text-slate-500 hover:text-slate-600 dark:hover:text-slate-300 transition-all";
            navLoans.className = inactiveClass;
            navRecs.className = inactiveClass;
            navBudget.className = inactiveClass;

            if (screen === 'loans') {
                loansScreen.classList.remove('hidden');
                navLoans.className = "flex flex-col items-center justify-center w-full h-full text-accent transition-all transform scale-105";
            } else if (screen === 'add') {
                addScreen.classList.remove('hidden');
            } else if (screen === 'recommendations') {
                recsScreen.classList.remove('hidden');
                navRecs.className = "flex flex-col items-center justify-center w-full h-full text-purple-600 dark:text-purple-400 transition-all transform scale-105";
                
                // Auto calculate if budget exists
                const budget = getBudgetForRecommendations();
                if (budget > 0) {
                    try {
                        calculateSmartRecommendations();
                    } catch (e) {
                        console.error("Auto calculation error:", e);
                    }
                }
            } else if (screen === 'budget') {
                budgetScreen.classList.remove('hidden');
                navBudget.className = "flex flex-col items-center justify-center w-full h-full text-blue-600 dark:text-blue-400 transition-all transform scale-105";
                updateBudgetUI();
            }
        };

        // Dark Mode Logic
        const toggleDarkMode = () => {
            document.documentElement.classList.toggle('dark');
            const isDark = document.documentElement.classList.contains('dark');
            localStorage.setItem('darkMode', isDark);
            updateDarkModeIcon(isDark);
            updateThemeColor(isDark);
        };

        const updateDarkModeIcon = (isDark) => {
            const icon = document.getElementById('darkModeIcon');
            if (isDark) {
                icon.classList.remove('fa-moon');
                icon.classList.add('fa-sun');
            } else {
                icon.classList.remove('fa-sun');
                icon.classList.add('fa-moon');
            }
        };

        const updateThemeColor = (isDark) => {
            const color = isDark ? '#0f172a' : '#ffffff';
            const meta = document.getElementById('themeColor');
            if (meta) {
                meta.content = color;
            }
            if (window.Android && window.Android.updateStatusBarColor) {
                window.Android.updateStatusBarColor(color);
            }
        };

        // --- Settings & Backup Logic ---
        const toggleSettingsModal = () => {
            const modal = document.getElementById('settingsModal');
            modal.classList.toggle('hidden');
        };

        const backupData = () => {
            const payload = { loans, incomes, otherExpenses };
            const dataStr = JSON.stringify(payload, null, 2);
            
            if (window.Android && window.Android.saveBackup) {
                window.Android.saveBackup(dataStr);
                return;
            }

            const blob = new Blob([dataStr], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `borc_takip_yedek_${new Date().toISOString().slice(0,10)}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            
            showConfirmModal('Başarılı', 'Yedek dosyası indirildi.', () => {}, 'success');
        };

        const restoreData = (input) => {
            const file = input.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async (e) => {
                try {
                    const imported = JSON.parse(e.target.result);
                    const importedLoans = Array.isArray(imported)
                        ? imported
                        : (imported && Array.isArray(imported.loans) ? imported.loans : null);
                    const importedIncomes = imported && Array.isArray(imported.incomes) ? imported.incomes : null;
                    const importedOtherExpenses = imported && Array.isArray(imported.otherExpenses) ? imported.otherExpenses : null;

                    if (Array.isArray(importedLoans)) {
                        toggleSettingsModal();
                        showConfirmModal('Verileri Geri Yükle', 'Mevcut veriler SİLİNECEK ve yedekten geri yüklenecek. Devam edilsin mi?', async () => {
                            loans = importedLoans;
                            incomes = importedIncomes || [];
                            otherExpenses = importedOtherExpenses || [];
                            await saveState();
                            updateBudgetUI();
                            updateUI();
                            showConfirmModal('Başarılı', 'Veriler başarıyla geri yüklendi.', () => {}, 'success');
                        }, 'danger');
                    } else {
                        throw new Error('Geçersiz format');
                    }
                } catch (err) {
                    showConfirmModal('Hata', 'Yedek dosyası geçersiz veya bozuk.', () => {}, 'danger');
                }
            };
            reader.readAsText(file);
            input.value = '';
        };

        const updateUI = () => {
            render();
            calculateSmartRecommendations();
        };

        // Init Dark Mode
        const savedDarkMode = localStorage.getItem('darkMode') === 'true';
        if (savedDarkMode) {
            document.documentElement.classList.add('dark');
            updateDarkModeIcon(true);
        }
        updateThemeColor(savedDarkMode);

        // State
        let loans = [];
        let incomes = [];
        let otherExpenses = [];

        // DOM Elements
        const form = document.getElementById('loanForm');
        const listContainer = document.getElementById('loanList');
        const emptyState = document.getElementById('emptyState');
        const totalMonthlyEl = document.getElementById('totalMonthlyPayment');
        const totalDebtEl = document.getElementById('totalRemainingDebt');
        const totalProfitEl = document.getElementById('totalProfit');
        const loanCountEl = document.getElementById('loanCount');
        
        const loanAmountInput = document.getElementById('loanAmount');
        const monthlyPaymentInput = document.getElementById('monthlyPayment');
        const totalInstallmentsInput = document.getElementById('totalInstallments');
        const paymentPreview = document.getElementById('paymentPreview');
        const previewTotalAmount = document.getElementById('previewTotalAmount');
        const previewWarning = document.getElementById('previewWarning');

        const editModal = document.getElementById('editModal');
        const editForm = document.getElementById('editForm');
        const detailModal = document.getElementById('detailModal');

        const filterBankNameInput = document.getElementById('filterBankName');
        const filterCategoryInput = document.getElementById('filterCategory');

        // Helpers
        const formatCurrency = (amount) => {
            return new Intl.NumberFormat('tr-TR', { style: 'currency', currency: 'TRY' }).format(amount);
        };

        const formatDate = (dateString) => {
            if (!dateString) return '-';
            const date = new Date(dateString);
            return new Intl.DateTimeFormat('tr-TR', { day: 'numeric', month: 'long', year: 'numeric' }).format(date);
        };

        const calculateNextPaymentDate = (loanDateStr, totalInstallments, remainingInstallments) => {
            if (!loanDateStr) return new Date(); 
            const loanDate = new Date(loanDateStr);
            const paidInstallments = totalInstallments - remainingInstallments;
            const nextPaymentMonthOffset = paidInstallments + 1;
            const nextDate = new Date(loanDate);
            nextDate.setMonth(nextDate.getMonth() + nextPaymentMonthOffset);
            return nextDate;
        };

        // Confirm Modal Logic
        let confirmCallbackFn = null;
        const confirmModal = document.getElementById('confirmModal');
        const confirmTitle = document.getElementById('confirmTitle');
        const confirmMessage = document.getElementById('confirmMessage');
        const btnConfirm = document.getElementById('btnConfirm');
        const btnCancel = document.getElementById('btnCancel');
        const confirmIconContainer = document.getElementById('confirmIconContainer');
        const confirmIcon = document.getElementById('confirmIcon');

        const showConfirmModal = (title, message, onConfirm, type = 'info') => {
            confirmTitle.textContent = title;
            confirmMessage.innerHTML = message.replace(/\n/g, '<br>');
            confirmCallbackFn = onConfirm;
            btnConfirm.className = "flex-1 py-3 px-4 text-white rounded-xl font-medium transition-colors text-sm shadow-lg";
            
            if (type === 'danger') {
                confirmIconContainer.className = "w-16 h-16 bg-red-50 dark:bg-red-900/20 rounded-full flex items-center justify-center mx-auto mb-4 text-red-500 dark:text-red-400";
                confirmIcon.className = "fa-solid fa-triangle-exclamation text-3xl";
                btnConfirm.classList.add('bg-red-600', 'hover:bg-red-700', 'shadow-red-600/20');
                btnConfirm.textContent = "Sil / İptal Et";
            } else if (type === 'success') {
                confirmIconContainer.className = "w-16 h-16 bg-emerald-50 dark:bg-emerald-900/20 rounded-full flex items-center justify-center mx-auto mb-4 text-emerald-500 dark:text-emerald-400";
                confirmIcon.className = "fa-solid fa-circle-check text-3xl";
                btnConfirm.classList.add('bg-emerald-600', 'hover:bg-emerald-700', 'shadow-emerald-600/20');
                btnConfirm.textContent = "Onayla";
            } else {
                confirmIconContainer.className = "w-16 h-16 bg-blue-50 dark:bg-blue-900/20 rounded-full flex items-center justify-center mx-auto mb-4 text-blue-500 dark:text-blue-400";
                confirmIcon.className = "fa-solid fa-circle-question text-3xl";
                btnConfirm.classList.add('bg-blue-600', 'hover:bg-blue-700', 'shadow-blue-600/20');
                btnConfirm.textContent = "Evet, Onayla";
            }
            confirmModal.classList.remove('hidden');
        };

        const closeConfirmModal = () => {
            confirmModal.classList.add('hidden');
            confirmCallbackFn = null;
        };

        btnConfirm.addEventListener('click', () => {
            if (confirmCallbackFn) confirmCallbackFn();
            closeConfirmModal();
        });

        btnCancel.addEventListener('click', closeConfirmModal);

        const saveState = async () => {
            const data = { loans, incomes, otherExpenses };
            await saveToCloud(data);
        };

        // -------- Budget (Income/Expense) Helpers --------
        const renderBudgetLists = () => {
            const incomeList = document.getElementById('incomeList');
            const expenseList = document.getElementById('expenseList');
            const loanExpenseList = document.getElementById('loanExpenseList');

            if (incomeList) {
                incomeList.innerHTML = '';
                if (incomes.length === 0) {
                    incomeList.innerHTML = '<div class="text-xs text-slate-400">Kayıtlı gelir yok.</div>';
                } else {
                    incomes.forEach((it, idx) => {
                        const div = document.createElement('div');
                        div.className = 'flex items-center justify-between p-2 bg-slate-50 dark:bg-slate-700/30 rounded-lg border border-slate-100 dark:border-slate-700';
                        div.innerHTML = `
                            <div class="text-xs">
                                <div class="font-bold text-slate-700 dark:text-slate-200">${it.name || 'Gelir'}</div>
                                <div class="text-slate-500 dark:text-slate-400"><span class="font-bold text-emerald-600 dark:text-emerald-400">+${formatCurrency(it.amount)}</span> • Ayın ${it.day}. günü</div>
                            </div>
                            <button class="text-red-500 hover:text-red-600 text-xs px-2 py-1 rounded-md bg-red-50 dark:bg-red-900/30 border border-red-200 dark:border-red-800" data-del-income="${idx}">
                                Sil
                            </button>
                        `;
                        incomeList.appendChild(div);
                    });
                    incomeList.querySelectorAll('[data-del-income]').forEach((btn) => {
                        btn.addEventListener('click', async (e) => {
                            const i = parseInt(e.currentTarget.getAttribute('data-del-income'), 10);
                            incomes.splice(i, 1);
                            await saveState();
                            renderBudgetLists();
                            generateBudgetPlan();
                        });
                    });
                }
            }

            if (loanExpenseList) {
                loanExpenseList.innerHTML = '';
                const now = new Date();
                const year = now.getFullYear();
                const month = now.getMonth();
                const items = [];

                loans.forEach((loan) => {
                    if (loan.isEarlyClosed || loan.remainingInstallments <= 0) return;
                    const nextDate = calculateNextPaymentDate(loan.loanDate, loan.totalInstallments, loan.remainingInstallments);
                    if (nextDate.getFullYear() === year && nextDate.getMonth() === month) {
                        items.push({
                            bankName: loan.bankName,
                            day: nextDate.getDate(),
                            amount: parseFloat(loan.monthlyPayment) || 0
                        });
                    }
                });

                if (items.length === 0) {
                    loanExpenseList.innerHTML = '<div class="text-xs text-slate-400">Bu ay için taksit görünmüyor.</div>';
                } else {
                    items.sort((a, b) => a.day - b.day);
                    items.forEach((it) => {
                        const div = document.createElement('div');
                        div.className = 'flex items-center justify-between p-2 bg-red-50/60 dark:bg-red-900/20 rounded-lg border border-red-100 dark:border-red-800';
                        div.innerHTML = `
                            <div class="text-xs">
                                <div class="font-bold text-slate-700 dark:text-slate-200">${it.bankName}</div>
                                <div class="text-slate-600 dark:text-slate-400">Ayın ${it.day}. günü • <span class="font-bold text-red-600 dark:text-red-400">-${formatCurrency(it.amount)}</span></div>
                            </div>
                            <div class="text-[11px] font-bold text-red-700 dark:text-red-300">-${formatCurrency(it.amount)}</div>
                        `;
                        loanExpenseList.appendChild(div);
                    });
                }
            }

            if (expenseList) {
                expenseList.innerHTML = '';
                if (otherExpenses.length === 0) {
                    expenseList.innerHTML = '<div class="text-xs text-slate-400">Kayıtlı gider yok.</div>';
                } else {
                    otherExpenses.forEach((it, idx) => {
                        const div = document.createElement('div');
                        div.className = 'flex items-center justify-between p-2 bg-slate-50 dark:bg-slate-700/30 rounded-lg border border-slate-100 dark:border-slate-700';
                        div.innerHTML = `
                            <div class="text-xs">
                                <div class="font-bold text-slate-700 dark:text-slate-200">${it.name || 'Gider'}</div>
                                <div class="text-slate-500 dark:text-slate-400"><span class="font-bold text-red-600 dark:text-red-400">-${formatCurrency(it.amount)}</span> • Ayın ${it.day}. günü</div>
                            </div>
                            <button class="text-red-500 hover:text-red-600 text-xs px-2 py-1 rounded-md bg-red-50 dark:bg-red-900/30 border border-red-200 dark:border-red-800" data-del-expense="${idx}">
                                Sil
                            </button>
                        `;
                        expenseList.appendChild(div);
                    });
                    expenseList.querySelectorAll('[data-del-expense]').forEach((btn) => {
                        btn.addEventListener('click', async (e) => {
                            const i = parseInt(e.currentTarget.getAttribute('data-del-expense'), 10);
                            otherExpenses.splice(i, 1);
                            await saveState();
                            renderBudgetLists();
                            generateBudgetPlan();
                        });
                    });
                }
            }
        };

        const addIncome = async (e) => {
            e.preventDefault();
            const name = document.getElementById('incomeName').value.trim();
            const amount = parseFloat(document.getElementById('incomeAmount').value);
            const day = parseInt(document.getElementById('incomeDay').value, 10);
            if (!amount || !day || day < 1 || day > 31) return;
            incomes.push({ name, amount, day });
            await saveState();
            e.target.reset();
            renderBudgetLists();
            generateBudgetPlan();
        };

        const addOtherExpense = async (e) => {
            e.preventDefault();
            const name = document.getElementById('expenseName').value.trim();
            const amount = parseFloat(document.getElementById('expenseAmount').value);
            const day = parseInt(document.getElementById('expenseDay').value, 10);
            if (!amount || !day || day < 1 || day > 31) return;
            otherExpenses.push({ name, amount, day });
            await saveState();
            e.target.reset();
            renderBudgetLists();
            generateBudgetPlan();
        };

        const generateBudgetPlan = () => {
            const container = document.getElementById('planResults');
            if (!container) return;
            container.innerHTML = '';

            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth();
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            const incomeByDay = Array(daysInMonth + 1).fill(0);
            const expenseByDay = Array(daysInMonth + 1).fill(0);
            const incomeItemsByDay = Array.from({ length: daysInMonth + 1 }, () => []);
            const expenseItemsByDay = Array.from({ length: daysInMonth + 1 }, () => []);

            incomes.forEach((i) => {
                const d = Math.min(Math.max(1, parseInt(i.day, 10)), daysInMonth);
                const amt = parseFloat(i.amount) || 0;
                incomeByDay[d] += amt;
                incomeItemsByDay[d].push({ label: i.name || 'Gelir', amount: amt, type: 'income' });
            });

            otherExpenses.forEach((x) => {
                const d = Math.min(Math.max(1, parseInt(x.day, 10)), daysInMonth);
                const amt = parseFloat(x.amount) || 0;
                expenseByDay[d] += amt;
                expenseItemsByDay[d].push({ label: x.name || 'Gider', amount: amt, type: 'expense' });
            });

            loans.forEach((loan) => {
                if (loan.isEarlyClosed || loan.remainingInstallments <= 0) return;
                const nextDate = calculateNextPaymentDate(loan.loanDate, loan.totalInstallments, loan.remainingInstallments);
                if (nextDate.getFullYear() === year && nextDate.getMonth() === month) {
                    const d = nextDate.getDate();
                    const amt = parseFloat(loan.monthlyPayment) || 0;
                    expenseByDay[d] += amt;
                    expenseItemsByDay[d].push({ label: `Kredi: ${loan.bankName}`, amount: amt, type: 'loan' });
                }
            });

            const totalIncome = incomeByDay.reduce((a, b) => a + b, 0);
            const totalExpense = expenseByDay.reduce((a, b) => a + b, 0);
            const remaining = totalIncome - totalExpense;

            const totalIncomeEl = document.getElementById('planTotalIncome');
            const totalExpenseEl = document.getElementById('planTotalExpense');
            const remainingEl = document.getElementById('planRemainingBudget');
            if (totalIncomeEl) totalIncomeEl.textContent = formatCurrency(totalIncome);
            if (totalExpenseEl) totalExpenseEl.textContent = formatCurrency(totalExpense);
            if (remainingEl) {
                remainingEl.textContent = formatCurrency(remaining);
                remainingEl.className = `text-sm font-bold ${remaining >= 0 ? 'text-emerald-600 dark:text-emerald-400' : 'text-red-600 dark:text-red-400'}`;
            }

            let balance = 0;
            for (let d = 1; d <= daysInMonth; d += 1) {
                const inc = incomeByDay[d];
                const exp = expenseByDay[d];
                if (inc === 0 && exp === 0) continue;
                balance += inc - exp;
                const risky = balance < 0;

                const dayBox = document.createElement('div');
                dayBox.className = `p-3 rounded-xl border shadow-sm ${risky ? 'bg-red-50 dark:bg-red-900/20 border-red-200 dark:border-red-800' : 'bg-white dark:bg-slate-800 border-slate-100 dark:border-slate-700'}`;

                const header = `
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-3">
                            <div class="w-9 h-9 rounded-lg flex items-center justify-center ${risky ? 'bg-red-100 text-red-600 dark:bg-red-900/40 dark:text-red-300' : 'bg-slate-100 text-slate-600 dark:bg-slate-700 dark:text-slate-300'}">
                                <i class="fa-solid ${risky ? 'fa-triangle-exclamation' : 'fa-calendar-day'} text-sm"></i>
                            </div>
                            <div>
                                <div class="text-xs font-bold text-slate-700 dark:text-slate-200">${d}.${month + 1}.${year}</div>
                                <div class="text-[11px] text-slate-500 dark:text-slate-400">
                                    Gelir: <span class="font-bold text-emerald-600 dark:text-emerald-400">+${formatCurrency(inc)}</span>
                                    •
                                    Gider: <span class="font-bold text-red-600 dark:text-red-400">-${formatCurrency(exp)}</span>
                                </div>
                            </div>
                        </div>
                        <div class="text-right">
                            <div class="text-[10px] uppercase tracking-wide text-slate-500 dark:text-slate-400">Bakiye</div>
                            <div class="font-bold ${risky ? 'text-red-600 dark:text-red-400' : 'text-emerald-600 dark:text-emerald-400'}">${formatCurrency(balance)}</div>
                        </div>
                    </div>
                `;

                const incomeItems = incomeItemsByDay[d]
                    .map((it) => `
                        <span class="text-[11px] px-2 py-1 rounded-lg bg-emerald-50 dark:bg-emerald-900/20 text-emerald-700 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-800">
                            ${it.label} • +${formatCurrency(it.amount)}
                        </span>
                    `)
                    .join(' ');

                const expenseItems = expenseItemsByDay[d]
                    .map((it) => `
                        <span class="text-[11px] px-2 py-1 rounded-lg border bg-red-50 dark:bg-red-900/20 text-red-700 dark:text-red-300 border-red-200 dark:border-red-800">
                            ${it.label} • -${formatCurrency(it.amount)}
                        </span>
                    `)
                    .join(' ');

                const lists = `
                    <div class="mt-3 space-y-2">
                        ${incomeItems ? `<div class="flex flex-wrap gap-1.5 items-center"><span class="text-[10px] font-bold text-slate-500 dark:text-slate-400">Gelir:</span> ${incomeItems}</div>` : ''}
                        ${expenseItems ? `<div class="flex flex-wrap gap-1.5 items-center"><span class="text-[10px] font-bold text-slate-500 dark:text-slate-400">Gider:</span> ${expenseItems}</div>` : ''}
                    </div>
                `;

                dayBox.innerHTML = header + lists;
                container.appendChild(dayBox);
            }

            if (container.innerHTML.trim() === '') {
                container.innerHTML = '<div class="text-sm text-slate-500 dark:text-slate-400">Bu ay için kayıtlı gelir veya gider bulunmuyor.</div>';
            }
        };

        const incomeFormEl = document.getElementById('incomeForm');
        if (incomeFormEl) incomeFormEl.addEventListener('submit', addIncome);
        const expenseFormEl = document.getElementById('expenseForm');
        if (expenseFormEl) expenseFormEl.addEventListener('submit', addOtherExpense);
        const btnGeneratePlan = document.getElementById('btnGeneratePlan');
        if (btnGeneratePlan) btnGeneratePlan.addEventListener('click', generateBudgetPlan);

        const updateBudgetUI = () => {
            renderBudgetLists();
            generateBudgetPlan();
        };

        function computeSmartPlans(budget) {
            if (!Number.isFinite(budget) || budget <= 0) {
                return {
                    profitPlan: { selected: [], totalCost: 0, totalProfit: 0 },
                    reliefPlan: { selected: [], totalCost: 0, totalRelief: 0 }
                };
            }

            const activeLoans = loans
                .filter((l) => !l.isEarlyClosed)
                .map((loan) => {
                    const totalInst = loan.totalInstallments > 0 ? loan.totalInstallments : 1;
                    const remainingInst = loan.remainingInstallments || 0;
                    const monthly = parseFloat(loan.monthlyPayment) || 0;
                    const loanAmount = parseFloat(loan.loanAmount) || 0;

                    const remainingPrincipal = (remainingInst / totalInst) * loanAmount;

                    let cost = remainingPrincipal;
                    if (
                        loan.earlyCloseAmount !== undefined &&
                        loan.earlyCloseAmount !== null &&
                        !isNaN(parseFloat(loan.earlyCloseAmount)) &&
                        parseFloat(loan.earlyCloseAmount) > 0
                    ) {
                        cost = parseFloat(loan.earlyCloseAmount);
                    }

                    const totalFuturePayment = remainingInst * monthly;
                    const profit = totalFuturePayment - cost;
                    const relief = monthly;

                    return {
                        ...loan,
                        cost,
                        profit,
                        relief,
                        originalIndex: loans.indexOf(loan)
                    };
                });

            const profitSorted = [...activeLoans].sort((a, b) => b.profit - a.profit);
            const profitPlan = { selected: [], totalCost: 0, totalProfit: 0 };
            let currentBudgetProfit = budget;

            profitSorted.forEach((loan) => {
                if (loan.cost <= currentBudgetProfit && loan.profit > 0) {
                    profitPlan.selected.push(loan);
                    profitPlan.totalCost += loan.cost;
                    profitPlan.totalProfit += loan.profit;
                    currentBudgetProfit -= loan.cost;
                }
            });

            const reliefSorted = [...activeLoans].sort((a, b) => {
                const costA = a.cost > 0 ? a.cost : 0.01;
                const costB = b.cost > 0 ? b.cost : 0.01;
                const efficiencyA = a.relief / costA;
                const efficiencyB = b.relief / costB;
                return efficiencyB - efficiencyA;
            });

            const reliefPlan = { selected: [], totalCost: 0, totalRelief: 0 };
            let currentBudgetRelief = budget;

            reliefSorted.forEach((loan) => {
                if (loan.cost <= currentBudgetRelief) {
                    reliefPlan.selected.push(loan);
                    reliefPlan.totalCost += loan.cost;
                    reliefPlan.totalRelief += loan.relief;
                    currentBudgetRelief -= loan.cost;
                }
            });

            return { profitPlan, reliefPlan };
        }

        const getBudgetForRecommendations = () => {
            const budgetInput = document.getElementById('budgetInput');
            const raw = budgetInput ? parseFloat(budgetInput.value) : 0;
            return Number.isFinite(raw) ? raw : 0;
        };

        const calculateSmartRecommendations = () => {
            try {
                const budget = getBudgetForRecommendations();
                const resultsContainer = document.getElementById('recommendationResults');
                const noRecContainer = document.getElementById('noRecommendation');
                const noBudgetContainer = document.getElementById('noBudget');
                
                if (budget <= 0) {
                    resultsContainer.classList.add('hidden');
                    noRecContainer.classList.add('hidden');
                    noBudgetContainer.classList.remove('hidden');
                    return;
                }
                noBudgetContainer.classList.add('hidden');

                const { profitPlan, reliefPlan } = computeSmartPlans(budget);

                const renderList = (plan, containerId, type) => {
                    const container = document.getElementById(containerId);
                    if (!container) return;
                    container.innerHTML = '';
                    
                    if (plan.selected.length === 0) {
                        container.innerHTML = '<li class="text-xs text-slate-400 italic">Bu strateji için uygun kredi yok.</li>';
                        return;
                    }

                    plan.selected.forEach(loan => {
                        const valueText = type === 'profit' 
                            ? `<span class="text-emerald-600 dark:text-emerald-400 font-bold text-xs">+${formatCurrency(loan.profit)}</span>`
                            : `<span class="text-blue-600 dark:text-blue-400 font-bold text-xs">-${formatCurrency(loan.relief)}/Ay</span>`;
                        
                        const li = document.createElement('li');
                        li.className = 'bg-white dark:bg-slate-800 p-3 rounded-xl border border-slate-100 dark:border-slate-700 flex justify-between items-center shadow-sm';
                        li.innerHTML = `
                            <div class="flex-1">
                                <div class="font-bold text-slate-700 dark:text-slate-200 text-sm">${loan.bankName}</div>
                                <div class="text-[10px] text-slate-500 dark:text-slate-400">Maliyet: ${formatCurrency(loan.cost)}</div>
                            </div>
                            <div class="flex items-center gap-2">
                                <div class="text-right">
                                    ${valueText}
                                </div>
                                <button onclick="earlyCloseLoan(${loan.originalIndex})" class="bg-red-500 hover:bg-red-600 text-white w-7 h-7 flex items-center justify-center rounded-lg transition-colors shadow-sm shadow-red-500/30" title="Erken Kapat">
                                    <i class="fa-solid fa-power-off text-xs"></i>
                                </button>
                            </div>
                        `;
                        container.appendChild(li);
                    });
                };

                renderList(profitPlan, 'profitList', 'profit');
                const profitUsedEl = document.getElementById('profitUsedBudget');
                const profitGainEl = document.getElementById('profitTotalGain');
                if (profitUsedEl) profitUsedEl.textContent = formatCurrency(profitPlan.totalCost);
                if (profitGainEl) profitGainEl.textContent = formatCurrency(profitPlan.totalProfit);

                renderList(reliefPlan, 'reliefList', 'relief');
                const reliefUsedEl = document.getElementById('reliefUsedBudget');
                const reliefGainEl = document.getElementById('reliefTotalGain');
                if (reliefUsedEl) reliefUsedEl.textContent = formatCurrency(reliefPlan.totalCost);
                if (reliefGainEl) reliefGainEl.textContent = formatCurrency(reliefPlan.totalRelief) + '/Ay';

                if (profitPlan.selected.length === 0 && reliefPlan.selected.length === 0) {
                    resultsContainer.classList.add('hidden');
                    noRecContainer.classList.remove('hidden');
                } else {
                    resultsContainer.classList.remove('hidden');
                    noRecContainer.classList.add('hidden');
                }
            } catch (err) {
                console.error("Smart Recommendations Error:", err);
            }
        };

        const render = () => {
            listContainer.innerHTML = '';
            
            const filterBank = filterBankNameInput.value.toLowerCase();
            const filterCat = filterCategoryInput.value;
            
            const filteredLoans = loans.filter(loan => {
                const matchBank = loan.bankName.toLowerCase().includes(filterBank);
                const matchCat = filterCat === 'all' || loan.category === filterCat;
                return matchBank && matchCat;
            });

            if (filteredLoans.length === 0) {
                listContainer.appendChild(emptyState);
                emptyState.style.display = 'block';
            } else {
                emptyState.style.display = 'none';
            }

            let grandTotalMonthly = 0;
            let grandTotalDebt = 0;
            let grandTotalProfit = 0;

            filteredLoans.forEach((loan) => {
                if (!loan.loanDate && loan.nextPaymentDate) loan.loanDate = new Date().toISOString().split('T')[0];
                if (!loan.totalInstallments) loan.totalInstallments = loan.remainingInstallments; 
                if (loan.earlyCloseAmount === undefined) loan.earlyCloseAmount = 0;

                const nextDate = calculateNextPaymentDate(loan.loanDate, loan.totalInstallments, loan.remainingInstallments);
                
                let isUrgent = false;
                if (!loan.isEarlyClosed) {
                    const diffTime = nextDate - new Date();
                    const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)); 
                    if (diffDays >= 0 && diffDays <= 3) isUrgent = true;
                }

                let displayRemainingInstallments = loan.remainingInstallments;
                let calcRemainingInstallments = loan.remainingInstallments;
                
                if (loan.isEarlyClosed) {
                    displayRemainingInstallments = 0;
                    calcRemainingInstallments = loan.savedInstallments || 0;
                }

                const totalFuturePayment = calcRemainingInstallments * loan.monthlyPayment;
                let remainingPrincipal = 0;
                if (!loan.isEarlyClosed) {
                    remainingPrincipal = (loan.remainingInstallments / loan.totalInstallments) * loan.loanAmount;
                }
                
                const hasEarlyCloseInfo = loan.earlyCloseAmount > 0;
                const profit = hasEarlyCloseInfo ? (totalFuturePayment - loan.earlyCloseAmount) : 0;

                if (!loan.isEarlyClosed) {
                    grandTotalMonthly += parseFloat(loan.monthlyPayment);
                    grandTotalDebt += remainingPrincipal; 
                }
                if (hasEarlyCloseInfo) grandTotalProfit += profit;

                const item = document.createElement('div');
                let borderClass = loan.isEarlyClosed 
                    ? 'border-l-4 border-l-emerald-500 bg-emerald-50/30 dark:bg-emerald-900/10' 
                    : (hasEarlyCloseInfo ? (profit > 0 ? 'border-l-4 border-l-emerald-400' : 'border-l-4 border-l-red-400') : 'border-l-4 border-l-slate-300 dark:border-l-slate-600');
                
                if (isUrgent && !loan.isEarlyClosed) borderClass = 'border-l-4 border-l-red-500 bg-red-50/50 dark:bg-red-900/10 ring-1 ring-red-200 dark:ring-red-800';

                item.className = `p-6 hover:bg-slate-50 dark:hover:bg-slate-700/30 transition-all relative group border-b border-slate-100 dark:border-slate-700 last:border-b-0 ${borderClass}`;
                
                const closedBadge = loan.isEarlyClosed ? 
                    `<div class="absolute top-4 right-4 bg-emerald-100 text-emerald-700 dark:bg-emerald-900/50 dark:text-emerald-300 text-[10px] font-bold px-2 py-1 rounded-md shadow-sm border border-emerald-200 dark:border-emerald-800">KAPATILDI</div>` : '';

                const urgentBadge = (isUrgent && !loan.isEarlyClosed) ? 
                    `<div class="absolute top-4 right-4 bg-red-100 text-red-600 dark:bg-red-900/50 dark:text-red-300 text-[10px] font-bold px-2 py-1 rounded-md shadow-sm animate-pulse border border-red-200 dark:border-red-800"><i class="fa-solid fa-bell mr-1"></i> ÖDEME YAKLAŞTI</div>` : '';

                const originalIndex = loans.indexOf(loan);

                item.innerHTML = `
                    ${closedBadge}
                    ${urgentBadge}
                    <div class="flex flex-col md:flex-row justify-between items-start gap-4">
                        <div class="flex-1 w-full">
                            <div class="flex justify-between items-start mb-3">
                                <div class="flex items-center gap-2 flex-wrap pr-20">
                                    <h3 class="text-base font-bold text-slate-800 dark:text-white">${loan.bankName}</h3>
                                    <span class="text-[10px] bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 px-2 py-0.5 rounded-full uppercase tracking-wide font-medium border border-slate-200 dark:border-slate-600">${loan.category}</span>
                                    ${hasEarlyCloseInfo ? `
                                    <span class="px-2 py-0.5 text-[10px] rounded-full font-bold border ${profit > 0 ? 'bg-emerald-50 dark:bg-emerald-900/20 text-emerald-600 dark:text-emerald-400 border-emerald-200 dark:border-emerald-800' : 'bg-red-50 dark:bg-red-900/20 text-red-600 dark:text-red-400 border-red-200 dark:border-red-800'}">
                                        ${profit > 0 ? 'Kârlı' : 'Zararlı'}
                                    </span>` : ''}
                                </div>
                            </div>

                            <div class="text-xs text-slate-500 dark:text-slate-400 mb-4 bg-slate-50/80 dark:bg-slate-700/30 p-2.5 rounded-lg border border-slate-100 dark:border-slate-600/50 flex justify-between items-center">
                                <span>Sonraki: <strong class="${isUrgent ? 'text-red-600 dark:text-red-400 font-bold' : 'text-slate-700 dark:text-slate-200'}">${loan.isEarlyClosed ? '-' : formatDate(nextDate)}</strong></span>
                                <span class="text-accent font-bold">Ödenen: ${loan.totalInstallments - displayRemainingInstallments} / ${loan.totalInstallments}</span>
                            </div>
                            
                            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 text-sm mb-4">
                                <div class="bg-white dark:bg-slate-800/50 p-2 rounded-lg border border-slate-100 dark:border-slate-700/50">
                                    <div class="text-slate-400 text-[10px] uppercase">Çekilen</div>
                                    <div class="font-bold text-slate-700 dark:text-slate-200">${formatCurrency(loan.loanAmount)}</div>
                                </div>
                                <div class="bg-white dark:bg-slate-800/50 p-2 rounded-lg border border-slate-100 dark:border-slate-700/50">
                                    <div class="text-slate-400 text-[10px] uppercase">Taksit</div>
                                    <div class="font-bold text-slate-700 dark:text-slate-200">${formatCurrency(loan.monthlyPayment)}</div>
                                </div>
                                <div class="bg-white dark:bg-slate-800/50 p-2 rounded-lg border border-slate-100 dark:border-slate-700/50">
                                    <div class="text-slate-400 text-[10px] uppercase">Kalan Borç</div>
                                    <div class="font-bold text-red-500 dark:text-red-400">${formatCurrency(remainingPrincipal)}</div>
                                </div>
                                <div class="bg-white dark:bg-slate-800/50 p-2 rounded-lg border border-slate-100 dark:border-slate-700/50">
                                    <div class="text-slate-400 text-[10px] uppercase">Kapama Tutarı</div>
                                    <div class="flex items-center gap-1 mt-0.5">
                                         <input type="number" step="0.01" 
                                            value="${loan.earlyCloseAmount}" 
                                            ${loan.isEarlyClosed ? 'disabled' : ''}
                                            onchange="updateEarlyClose(${originalIndex}, this.value)"
                                            class="w-full text-xs bg-transparent border-b border-slate-300 dark:border-slate-600 focus:border-accent outline-none font-bold text-slate-700 dark:text-white disabled:opacity-50">
                                         ${(!loan.isEarlyClosed && hasEarlyCloseInfo) ? `
                                         <button onclick="earlyCloseLoan(${originalIndex})" class="text-emerald-500 hover:text-emerald-600 transition-colors" title="Kapat">
                                            <i class="fa-solid fa-circle-check text-lg"></i>
                                         </button>` : ''}
                                    </div>
                                </div>
                            </div>

                            <div class="flex flex-wrap gap-2 pt-3 border-t border-slate-100 dark:border-slate-700/50">
                                ${!loan.isEarlyClosed ? `
                                <div class="flex items-center gap-1">
                                    <button onclick="undoInstallment(${originalIndex})" class="bg-slate-200 hover:bg-slate-300 dark:bg-slate-700 dark:hover:bg-slate-600 text-slate-600 dark:text-slate-300 w-8 h-8 rounded-lg transition-colors flex items-center justify-center" title="Geri Al">
                                        <i class="fa-solid fa-rotate-left text-xs"></i>
                                    </button>
                                    <button onclick="payInstallment(${originalIndex})" class="bg-accent hover:bg-indigo-600 text-white text-xs px-3 py-2 rounded-lg transition-colors flex items-center shadow-sm shadow-accent/20">
                                        <i class="fa-solid fa-check mr-1.5"></i> Taksit Öde
                                    </button>
                                </div>
                                <button onclick="openEditModal(${originalIndex})" class="bg-amber-400 hover:bg-amber-500 text-white text-xs px-3 py-2 rounded-lg transition-colors flex items-center shadow-sm shadow-amber-400/20">
                                    <i class="fa-solid fa-pen mr-1.5"></i> Düzenle
                                </button>
                                ` : `
                                <div class="text-xs text-emerald-600 dark:text-emerald-400 font-bold flex items-center bg-emerald-50 dark:bg-emerald-900/20 px-3 py-1.5 rounded-lg border border-emerald-100 dark:border-emerald-800">
                                    <i class="fa-solid fa-check-double mr-1.5"></i> Borç bitti
                                </div>
                                `}
                                <button onclick="openDetailModal(${originalIndex})" class="bg-blue-500 hover:bg-blue-600 text-white text-xs px-3 py-2 rounded-lg transition-colors flex items-center shadow-sm shadow-blue-500/20">
                                    <i class="fa-solid fa-list-ul mr-1.5"></i> Detay
                                </button>
                                <button onclick="deleteLoan(${originalIndex})" class="bg-red-100 hover:bg-red-200 dark:bg-red-900/30 dark:hover:bg-red-900/50 text-red-600 dark:text-red-400 text-xs px-3 py-2 rounded-lg transition-colors flex items-center ml-auto border border-red-200 dark:border-red-800/50">
                                    <i class="fa-solid fa-trash mr-1.5"></i> Sil
                                </button>
                            </div>
                        </div>
                    </div>
                `;
                listContainer.appendChild(item);
            });

            totalMonthlyEl.textContent = formatCurrency(grandTotalMonthly);
            totalDebtEl.textContent = formatCurrency(grandTotalDebt);
            totalProfitEl.textContent = formatCurrency(grandTotalProfit);
            loanCountEl.textContent = `${filteredLoans.length} Adet`;
        };
        
        // Listeners
        filterBankNameInput.addEventListener('input', render);
        filterCategoryInput.addEventListener('change', render);

        const updatePreview = () => {
            const monthly = parseFloat(monthlyPaymentInput.value) || 0;
            const total = parseInt(totalInstallmentsInput.value) || 0;
            const loanAmount = parseFloat(loanAmountInput.value) || 0;
            
            if (monthly > 0 && total > 0) {
                const totalPayment = monthly * total;
                previewTotalAmount.textContent = formatCurrency(totalPayment);
                paymentPreview.classList.remove('hidden');
                
                if (loanAmount > 0 && totalPayment < loanAmount) {
                    previewWarning.classList.remove('hidden');
                } else {
                    previewWarning.classList.add('hidden');
                }
            } else {
                paymentPreview.classList.add('hidden');
            }
        };

        loanAmountInput.addEventListener('input', updatePreview);
        monthlyPaymentInput.addEventListener('input', updatePreview);
        totalInstallmentsInput.addEventListener('input', updatePreview);

        // Actions
        const addLoan = async (e) => {
            e.preventDefault();
            
            const bankName = document.getElementById('bankName').value;
            const loanAmount = parseFloat(document.getElementById('loanAmount').value);
            const monthlyPayment = parseFloat(document.getElementById('monthlyPayment').value);
            const totalInstallments = parseInt(document.getElementById('totalInstallments').value);
            const loanDate = document.getElementById('loanDate').value;
            const category = document.getElementById('category').value;

            const proceedToAdd = async () => {
                const newLoan = {
                    bankName,
                    category,
                    loanAmount,
                    monthlyPayment,
                    totalInstallments,
                    remainingInstallments: totalInstallments, 
                    loanDate,
                    earlyCloseAmount: 0,
                    createdAt: new Date().toISOString()
                };

                loans.push(newLoan);
                await saveState();
                render();
                form.reset();
                paymentPreview.classList.add('hidden');
                document.getElementById('loanDate').valueAsDate = new Date();
                switchScreen('loans');
            };

            const totalPayment = monthlyPayment * totalInstallments;
            if (totalPayment < loanAmount) {
                showConfirmModal(
                    'Düşük Geri Ödeme Uyarısı',
                    `Toplam geri ödeme (${formatCurrency(totalPayment)}), çekilen tutardan (${formatCurrency(loanAmount)}) düşük! Yine de devam edilsin mi?`,
                    proceedToAdd,
                    'danger'
                );
            } else {
                await proceedToAdd();
            }
        };

        window.updateEarlyClose = async (index, value) => {
            const val = parseFloat(value);
            if (isNaN(val)) return;
            loans[index].earlyCloseAmount = val;
            await saveState();
            render();
        };

        window.earlyCloseLoan = (index) => {
            const loan = loans[index];
            if (loan.isEarlyClosed) return;

            const totalFuturePayment = loan.remainingInstallments * loan.monthlyPayment;
            const profit = totalFuturePayment - loan.earlyCloseAmount;

            showConfirmModal(
                'Erken Kapama',
                `${loan.bankName} kredisini KAPATMAK istiyor musunuz?\n\nKâr/Zarar: ${formatCurrency(profit)}`,
                async () => {
                    const closeCost = loan.earlyCloseAmount;
                    loan.isEarlyClosed = true;
                    loan.savedInstallments = loan.remainingInstallments;
                    loan.remainingInstallments = 0;
                    loan.closedAt = new Date().toISOString();
                    
                    await saveState();
                    render();
                    updateBudgetUI();
                    calculateSmartRecommendations();

                    const budgetInput = document.getElementById('budgetInput');
                    if (budgetInput && budgetInput.value.trim() !== '') {
                        let currentBudget = parseFloat(budgetInput.value);
                        if (!isNaN(currentBudget)) {
                            currentBudget -= closeCost;
                            budgetInput.value = currentBudget > 0 ? currentBudget : 0;
                            calculateSmartRecommendations();
                        }
                    }
                },
                'info'
            );
        };

        window.deleteLoan = (index) => {
            showConfirmModal(
                'Kredi Silme',
                'Bu kredi kaydını tamamen silmek istediğinize emin misiniz? Bu işlem geri alınamaz.',
                async () => {
                    loans.splice(index, 1);
                    await saveState();
                    render();
                },
                'danger'
            );
        };

        window.payInstallment = (index) => {
            if (loans[index].remainingInstallments <= 0) return;

            showConfirmModal(
                'Taksit Ödemesi', 
                `${loans[index].bankName} için 1 taksit ödemesini onaylıyor musunuz?`, 
                async () => {
                    loans[index].remainingInstallments -= 1;
                    
                    if (!loans[index].paymentHistory) loans[index].paymentHistory = [];
                    loans[index].paymentHistory.push({
                        date: new Date().toISOString(),
                        amount: loans[index].monthlyPayment,
                        type: 'installment'
                    });

                    await saveState();
                    render();
                },
                'success'
            );
        };

        window.undoInstallment = (index) => {
            if (loans[index].remainingInstallments >= loans[index].totalInstallments) return;

            showConfirmModal(
                'İşlem Geri Alma',
                `Son yapılan taksit ödemesini geri almak istediğinize emin misiniz?`,
                async () => {
                    loans[index].remainingInstallments += 1;
                    if (loans[index].paymentHistory && loans[index].paymentHistory.length > 0) {
                        loans[index].paymentHistory.pop();
                    }
                    await saveState();
                    render();
                },
                'danger'
            );
        };

        // Detail Modal
        let currentDetailIndex = -1;

        window.switchTab = (tab) => {
            const btnPlan = document.getElementById('tabPlan');
            const btnHistory = document.getElementById('tabHistory');
            const contentPlan = document.getElementById('contentPlan');
            const contentHistory = document.getElementById('contentHistory');

            if (tab === 'plan') {
                btnPlan.className = "flex-1 py-3 text-center border-b-2 border-accent font-bold text-accent bg-slate-50 dark:bg-slate-800/50 transition-colors text-sm";
                btnHistory.className = "flex-1 py-3 text-center border-b-2 border-transparent text-slate-500 hover:text-slate-700 dark:text-slate-400 hover:border-slate-300 transition-colors text-sm";
                contentPlan.classList.remove('hidden');
                contentHistory.classList.add('hidden');
            } else {
                btnHistory.className = "flex-1 py-3 text-center border-b-2 border-accent font-bold text-accent bg-slate-50 dark:bg-slate-800/50 transition-colors text-sm";
                btnPlan.className = "flex-1 py-3 text-center border-b-2 border-transparent text-slate-500 hover:text-slate-700 dark:text-slate-400 hover:border-slate-300 transition-colors text-sm";
                contentHistory.classList.remove('hidden');
                contentPlan.classList.add('hidden');
                renderHistory(currentDetailIndex);
            }
        };

        const renderHistory = (index) => {
            const loan = loans[index];
            const historyList = document.getElementById('historyList');
            const noHistory = document.getElementById('noHistory');
            historyList.innerHTML = '';

            if (!loan.paymentHistory || loan.paymentHistory.length === 0) {
                noHistory.classList.remove('hidden');
                return;
            }

            noHistory.classList.add('hidden');
            const sortedHistory = [...loan.paymentHistory].sort((a, b) => new Date(b.date) - new Date(a.date));

            sortedHistory.forEach(item => {
                const date = new Date(item.date);
                const formattedDate = new Intl.DateTimeFormat('tr-TR', { day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute:'2-digit' }).format(date);
                
                const div = document.createElement('div');
                div.className = "flex justify-between items-center p-3 bg-slate-50 dark:bg-slate-700/30 rounded-xl border border-slate-100 dark:border-slate-700/50";
                div.innerHTML = `
                    <div class="flex items-center gap-3">
                        <div class="bg-emerald-100 dark:bg-emerald-900/30 p-2 rounded-full text-emerald-600 dark:text-emerald-400">
                            <i class="fa-solid fa-check text-xs"></i>
                        </div>
                        <div>
                            <div class="font-bold text-slate-700 dark:text-white text-xs">Taksit Ödemesi</div>
                            <div class="text-[10px] text-slate-400 dark:text-slate-500">${formattedDate}</div>
                        </div>
                    </div>
                    <div class="font-bold text-slate-700 dark:text-slate-200 text-sm">
                        ${formatCurrency(item.amount)}
                    </div>
                `;
                historyList.appendChild(div);
            });
        };

        window.openDetailModal = (index) => {
            currentDetailIndex = index;
            const loan = loans[index];
            const tbody = document.getElementById('detailTableBody');
            tbody.innerHTML = '';
            document.getElementById('detailModalTitle').textContent = `${loan.bankName}`;
            switchTab('plan');

            const loanDate = new Date(loan.loanDate);
            const paidCount = loan.totalInstallments - loan.remainingInstallments;
            
            for(let i = 1; i <= loan.totalInstallments; i++) {
                const row = document.createElement('tr');
                const payDate = new Date(loanDate);
                payDate.setMonth(payDate.getMonth() + i);
                
                let status = '';
                let statusClass = '';
                let rowClass = 'dark:text-slate-300';

                if (loan.isEarlyClosed) {
                     if (i <= (loan.totalInstallments - loan.savedInstallments)) {
                         status = 'Ödendi';
                         statusClass = 'text-emerald-600 dark:text-emerald-400 font-bold';
                     } else {
                         status = 'Ödendi (Erken Kapama)';
                         statusClass = 'text-blue-600 dark:text-blue-400 font-bold text-[10px]';
                     }
                } else {
                    if (i <= paidCount) {
                        status = 'Ödendi';
                        statusClass = 'text-emerald-600 dark:text-emerald-400 font-bold';
                    } else if (i === paidCount + 1) {
                        status = 'Sırada';
                        statusClass = 'text-accent font-bold';
                        rowClass = 'bg-blue-50/50 dark:bg-blue-900/10 dark:text-white';
                    } else {
                        status = 'Bekliyor';
                        statusClass = 'text-slate-400 dark:text-slate-500';
                    }
                }

                row.className = rowClass;
                row.innerHTML = `
                    <td class="px-4 py-3 whitespace-nowrap text-xs text-slate-500 dark:text-slate-400">${i}</td>
                    <td class="px-4 py-3 whitespace-nowrap text-xs">${formatDate(payDate)}</td>
                    <td class="px-4 py-3 whitespace-nowrap text-xs font-medium">${formatCurrency(loan.monthlyPayment)}</td>
                    <td class="px-4 py-3 whitespace-nowrap text-xs ${statusClass}">${status}</td>
                `;
                tbody.appendChild(row);
            }
            detailModal.classList.remove('hidden');
        };

        window.closeDetailModal = () => detailModal.classList.add('hidden');

        // Edit Logic
        window.openEditModal = (index) => {
            const loan = loans[index];
            document.getElementById('editIndex').value = index;
            document.getElementById('editBankName').value = loan.bankName;
            document.getElementById('editCategory').value = loan.category || 'Diğer';
            document.getElementById('editMonthlyPayment').value = loan.monthlyPayment;
            document.getElementById('editTotalInstallments').value = loan.totalInstallments;
            document.getElementById('editLoanDate').value = loan.loanDate;
            document.getElementById('editEarlyCloseAmount').value = loan.earlyCloseAmount;
            editModal.classList.remove('hidden');
        };

        window.closeEditModal = () => editModal.classList.add('hidden');

        editForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const index = document.getElementById('editIndex').value;
            loans[index].bankName = document.getElementById('editBankName').value;
            loans[index].category = document.getElementById('editCategory').value;
            loans[index].monthlyPayment = parseFloat(document.getElementById('editMonthlyPayment').value);
            loans[index].totalInstallments = parseInt(document.getElementById('editTotalInstallments').value);
            loans[index].loanDate = document.getElementById('editLoanDate').value;
            loans[index].earlyCloseAmount = parseFloat(document.getElementById('editEarlyCloseAmount').value);
            await saveState();
            closeEditModal();
            render();
        });

        // Init
        form.addEventListener('submit', addLoan);
        window.onclick = (e) => {
            if (e.target == editModal) closeEditModal();
            if (e.target == detailModal) closeDetailModal();
            if (e.target == confirmModal) closeConfirmModal();
        }
        document.getElementById('loanDate').valueAsDate = new Date();
        
        // Initial Local Render
        updateBudgetUI();
        render();

        // CLOUD LOAD ON START
        window.addEventListener("DOMContentLoaded", async () => {
            const cloudData = await loadFromCloud();

            if (cloudData) {
                loans = cloudData.loans || [];
                incomes = cloudData.incomes || [];
                otherExpenses = cloudData.otherExpenses || [];
            }

            // UI'ı asenkron veri yüklendikten sonra yeniden tetikliyoruz
            updateBudgetUI();
            render();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js?v=6');
            });
        }
    </script>
